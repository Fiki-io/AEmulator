name: Build AEmulator APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept SDK Licenses and Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Standard Debug & Release APKs
        run: ./gradlew assembleStandardDebug assembleStandardRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-Standard-Debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-Standard-Release-Unsigned
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: warn
