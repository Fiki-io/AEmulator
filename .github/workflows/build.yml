name: Build AEmulator APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Standard Debug & Release APKs
        run: ./gradlew assembleStandardDebug assembleStandardRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-Standard-Debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-Standard-Release-Unsigned
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: warn
